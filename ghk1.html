<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bài kiểm tra Tin học 9</title>
  <style>
    :root { --blue: #2563eb; --blue-dark: #1d4ed8; --bg: #f4f7fb; --card: #ffffff; --text: #172033; --muted: #58657d; --line: #dfe7f4; --good: #15803d; --bad: #b91c1c; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); }
    .wrap { max-width: 860px; margin: 32px auto; padding: 0 16px 40px; }
    .header { background: linear-gradient(135deg, var(--blue), #60a5fa); color: white; border-radius: 18px; padding: 28px 22px; box-shadow: 0 8px 24px rgba(37,99,235,0.2); }
    h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 3vw, 2.2rem); }
    .meta { margin: 0; opacity: 0.96; }
    .pill { display: inline-block; margin-top: 12px; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.45); }
    .card { margin-top: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: 0 3px 12px rgba(15,23,42,0.05); }
    .score-line { font-weight: 700; margin-bottom: 14px; color: var(--muted); }
    .question-box { border: 1px solid var(--line); border-radius: 12px; background: #fbfdff; padding: 18px; margin-top: 10px; }
    .question-title { font-weight: 700; margin-bottom: 12px; line-height: 1.5; }
    .answer-btn { display: block; width: 100%; padding: 12px 14px; margin: 10px 0; border: 1px solid #d5deef; border-radius: 10px; background: #fff; font-size: 1rem; text-align: left; cursor: pointer; }
    .answer-btn:hover { border-color: #9db7f3; background: #f7faff; }
    .answer-btn.correct { background: #e7f8ee; border-color: #4fc679; color: var(--good); }
    .answer-btn.wrong { background: #fdecec; border-color: #f39a9a; color: var(--bad); }
    .answer-btn:disabled { cursor: default; opacity: 1; }
    .controls { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
    button { border: none; border-radius: 10px; padding: 12px 16px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    .primary { background: var(--blue); color: white; }
    .secondary { background: #edf3ff; color: var(--text); }
    .status { margin-top: 14px; min-height: 24px; font-weight: 700; }
    .status.good { color: var(--good); }
    .status.bad { color: var(--bad); }
    .result-box { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: #eef6ff; border: 1px solid #bfd3ff; }
    @media (max-width: 600px) { .card { padding: 16px; } .controls { flex-direction: column; } button { width: 100%; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="header">
      <h1>BÀI KIỂM TRA GIỮA HỌC KÌ I - TIN HỌC 9</h1>
      <p class="meta">Năm học 2026–2027</p>
      <p class="meta">Bộ sách: Kết nối tri thức với cuộc sống</p>
      <span class="pill">Trắc nghiệm · xáo trộn câu hỏi + đáp án · lưu tiến độ</span>
    </header>

    <div class="card">
      <div id="scoreLine" class="score-line">Điểm: 0/0</div>
      <div id="questionWrap"></div>
      <div id="status" class="status"></div>
      <div class="controls">
        <button id="nextBtn" class="primary" style="display:none;">Câu tiếp theo</button>
        <button id="saveBtn" class="secondary">Lưu JSON</button>
        <button id="resetBtn" class="secondary">Reset</button>
      </div>
      <div id="resultBox" class="result-box" style="display:none;"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'quiz_state_l9new';
    const QUESTIONS = [
      { question: 'Phát biểu nào mô tả đúng vai trò của máy tính trong đời sống hiện nay?', answers: ['Máy tính chỉ dùng để soạn thảo văn bản', 'Máy tính hỗ trợ học tập, làm việc, giải trí và truyền thông', 'Máy tính chỉ dùng cho người già', 'Máy tính không cần kết nối Internet'], correct: 1 },
      { question: 'Đâu là ứng dụng phổ biến của máy tính trong học tập?', answers: ['Xem điện thoại', 'Lập trình, soạn thảo văn bản và tìm kiếm tài liệu', 'Không thể học online', 'Chỉ dùng để chơi game'], correct: 1 },
      { question: 'Công việc nào sau đây là mô phỏng tin học tốt nhất?', answers: ['Đọc sách bằng giấy', 'Sử dụng phần mềm để xử lý văn bản và dữ liệu', 'Đánh số trang bằng tay', 'Ngồi im không làm gì'], correct: 1 },
      { question: 'Mức độ an toàn khi sử dụng Internet phụ thuộc vào?', answers: ['Chỉ vào thiết bị', 'Kỹ năng nhận biết, kiểm tra thông tin và giữ bí mật', 'Số lượng mới mua', 'Không phụ thuộc gì'], correct: 1 },
      { question: 'Thông tin trên Internet cần được kiểm tra vì?', answers: ['Tất cả đều đáng tin cậy', 'Có thể không chính xác hoặc dùng sai mục đích', 'Internet không có thông tin', 'Mọi thông tin đều từ chính phủ'], correct: 1 },
      { question: 'Nếu gặp nội dung gây hại hoặc đáng ngờ, em nên làm gì?', answers: ['Chia sẻ ngay cho bạn bè', 'Bỏ qua và báo cho người lớn hoặc giáo viên', 'Tải xuống tất cả', 'Đăng tải lên mạng'], correct: 1 },
      { question: 'Đâu là cách bảo vệ thông tin cá nhân hiệu quả?', answers: ['Dùng mật khẩu yếu và lặp lại', 'Chia sẻ với mọi người', 'Dùng mật khẩu mạnh và không chia sẻ thông tin nhạy cảm', 'Mở mọi liên kết lạ'], correct: 2 },
      { question: 'Lợi ích lớn nhất của văn phòng kỹ thuật số là?', answers: ['Tăng chiều cao màn hình', 'Tiết kiệm thời gian và nâng cao hiệu quả làm việc', 'Chỉ cho máy tính chạy nhanh hơn', 'Không cần phần mềm'], correct: 1 },
      { question: 'Trong học tập trực tuyến, em cần chú ý gì nhất?', answers: ['Mọi bài giảng đều đúng', 'Quản lý thời gian, kiểm tra nguồn và giữ thái độ học tập tích cực', 'Không cần nghe giảng', 'Chỉ học khi có điện'], correct: 1 },
      { question: 'Khi sử dụng điện thoại và máy tính, em nên?', answers: ['Dùng quá lâu không nghỉ', 'Sử dụng đúng cách, bảo vệ mắt và sức khỏe', 'Không cần ngồi đúng tư thế', 'Dùng máy tính ở nơi tối'], correct: 1 }
    ];

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildQuestionSet() {
      return shuffleArray(QUESTIONS).map(q => {
        const answerItems = shuffleArray(q.answers.map((text, index) => ({ text, originalIndex: index })));
        const correct = answerItems.findIndex(item => item.originalIndex === q.correct);
        return {
          question: q.question,
          answers: answerItems.map(item => item.text),
          correct,
          userAnswer: null,
          answered: false,
          explanation: 'Đáp án đúng là: ' + q.answers[q.correct]
        };
      });
    }

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return { questions: buildQuestionSet(), index: 0, score: 0, finished: false };
      try {
        const parsed = JSON.parse(saved);
        if (!Array.isArray(parsed.questions) || parsed.questions.length === 0) return { questions: buildQuestionSet(), index: 0, score: 0, finished: false };
        return parsed;
      } catch {
        return { questions: buildQuestionSet(), index: 0, score: 0, finished: false };
      }
    }

    function saveState(state) { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

    function renderQuestion(state) {
      const q = state.questions[state.index];
      const scoreLine = document.getElementById('scoreLine');
      const questionWrap = document.getElementById('questionWrap');
      const status = document.getElementById('status');
      const nextBtn = document.getElementById('nextBtn');
      const resultBox = document.getElementById('resultBox');

      if (!q) {
        questionWrap.innerHTML = '<div class="question-box"><div class="question-title">Bạn đã hoàn thành bài kiểm tra.</div></div>';
        scoreLine.textContent = `Điểm: ${state.score}/${state.questions.length}`;
        status.className = 'status';
        status.textContent = state.score === state.questions.length ? 'Tuyệt vời! Bạn làm đúng tất cả.' : 'Hãy xem lại các câu sai và làm lại nếu muốn.';
        nextBtn.style.display = 'none';
        resultBox.style.display = 'block';
        resultBox.innerHTML = `Kết quả cuối: ${state.score}/${state.questions.length} câu đúng.`;
        return;
      }

      scoreLine.textContent = `Điểm: ${state.score}/${state.questions.length}`;
      questionWrap.innerHTML = `
        <div class="question-box">
          <div class="question-title">Câu ${state.index + 1}: ${q.question}</div>
          ${q.answers.map((answer, idx) => {
            let cls = 'answer-btn';
            if (q.answered) {
              cls += ' disabled';
              if (idx === q.correct) cls += ' correct';
              if (q.userAnswer === idx && idx !== q.correct) cls += ' wrong';
            }
            return `<button class="${cls}" data-index="${idx}" ${q.answered ? 'disabled' : ''}>${String.fromCharCode(65 + idx)}. ${answer}</button>`;
          }).join('')}
        </div>
      `;

      questionWrap.querySelectorAll('.answer-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (q.answered) return;
          q.userAnswer = Number(btn.dataset.index);
          q.answered = true;
          if (q.userAnswer === q.correct) {
            state.score += 1;
            status.textContent = 'Đúng rồi!';
            status.className = 'status good';
          } else {
            status.textContent = 'Sai rồi! ' + q.explanation;
            status.className = 'status bad';
          }
          saveState(state);
          renderQuestion(state);
        });
      });

      if (q.answered) {
        status.textContent = q.userAnswer === q.correct ? 'Đúng rồi!' : 'Sai rồi! ' + q.explanation;
        status.className = q.userAnswer === q.correct ? 'status good' : 'status bad';
        nextBtn.style.display = 'inline-block';
      } else {
        status.textContent = '';
        status.className = 'status';
        nextBtn.style.display = 'none';
      }

      resultBox.style.display = 'none';
    }

    function nextQuestion() {
      const state = loadState();
      if (state.index < state.questions.length - 1) {
        state.index += 1;
        saveState(state);
        renderQuestion(state);
      } else {
        state.finished = true;
        saveState(state);
        renderQuestion(state);
      }
    }

    function resetQuiz() {
      if (!confirm('Bạn có muốn reset toàn bộ tiến độ?')) return;
      const fresh = { questions: buildQuestionSet(), index: 0, score: 0, finished: false };
      localStorage.removeItem(STORAGE_KEY);
      saveState(fresh);
      renderQuestion(fresh);
    }

    async function saveQuizJson() {
      const state = loadState();
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const filename = 'quiz_l9new.json';
      if (window.showDirectoryPicker) {
        try {
          const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite', startIn: 'desktop' });
          const fileHandle = await dirHandle.getFileHandle(filename, { create: true });
          const writable = await fileHandle.createWritable();
          await writable.write(blob);
          await writable.close();
          alert('Đã lưu JSON vào thư mục đã chọn.');
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
          console.warn('Không thể chọn thư mục trực tiếp, sẽ tải xuống.', err);
        }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      alert('Đã tải xuống tệp JSON. Nếu bạn đang trên Windows hoặc Linux, hãy lưu vào Desktop hoặc thư mục mong muốn.');
    }

    document.getElementById('nextBtn').addEventListener('click', nextQuestion);
    document.getElementById('saveBtn').addEventListener('click', saveQuizJson);
    document.getElementById('resetBtn').addEventListener('click', resetQuiz);

    const initial = loadState();
    saveState(initial);
    renderQuestion(initial);
  </script>
</body>
</html>
